name: FACETS

on:
  push:
    paths:
      - "facets/**"
      - ".github/workflows/facets.yml"
  pull_request:
    paths:
      - "facets/**"
      - ".github/workflows/facets.yml"

permissions:
  contents: read

jobs:
  test:
    name: Godot ${{ matrix.godot }} headless
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned baseline (implementation decision D-001).
          - godot: "4.7.2"
            sha512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
            baseline: true
          # Additional tested version; compatibility is claimed only while this passes.
          - godot: "4.6.3"
            sha512: "a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c"
            baseline: false
    env:
      GODOT_VERSION: ${{ matrix.godot }}
      # SHA-512 of Godot_v<version>-stable_linux.x86_64.zip from the official SHA512-SUMS.txt.
      GODOT_SHA512: ${{ matrix.sha512 }}
    defaults:
      run:
        working-directory: facets
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --path . --editor --import'

      - name: Parse check
        run: '"$GODOT" --headless --path . --script tools/parse_check.gd'

      - name: Rules, session, editor-model, demo and combat tests
        run: '"$GODOT" --headless --path . --script tests/run_tests.gd'

      - name: Editor self-test (plugin enable/disable, undo/redo)
        run: tools/run_editor_selftest.sh

      - name: Clean install of addons/facets
        run: tools/verify_clean_install.sh

      - name: Exported transport fixtures are reproducible
        if: matrix.baseline
        run: |
          "$GODOT" --headless --path . --script tools/export_fixtures.gd
          git diff --exit-code -- tests/fixtures/schemas

      - uses: actions/setup-python@v5
        if: matrix.baseline
        with:
          python-version: "3.12"

      - name: JSON Schemas and fixtures
        if: matrix.baseline
        run: |
          python -m pip install --quiet "jsonschema>=4.18"
          python tools/check_schemas.py

      - name: Reference fixtures are reproducible
        if: matrix.baseline
        run: |
          python tools/generate_rule_fixtures.py
          git diff --exit-code -- tests/fixtures/rules

      - name: Release archives
        if: matrix.baseline
        run: python tools/build_release.py

      - uses: actions/upload-artifact@v4
        if: matrix.baseline
        with:
          name: facets-release
          path: facets/build/*.zip
          if-no-files-found: error
